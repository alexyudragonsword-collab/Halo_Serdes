# CANONICAL product mixed-signal configuration — the default of this mode.
# 16 Gb/s NRZ is the validated upper limit of the CTLE + DFE partition
# (no RX FFE); higher rates belong to the ADC/DSP architecture.
# Validated on the Whisper backplane (-18.7 dB @ 8 GHz Nyquist):
# post-DFE inner eye 105 mV, BER 0 / 1.1e5 (examples/10).
modulation: nrz
symbol_rate: 16.0e9
osr: 32
channel:
  kind: touchstone
  file: data/channels/TEC_Whisper42p8in_Meg6_THRU_C8C9.s4p
  zs_diff: 100.0
  zl_diff: 100.0
  n_freq: 4096
tx:
  # 3-tap FIR is trained over the backchannel (engine.backchannel.train_tx_fir
  # with dfe_covered=4); [1.0] means "not yet trained"
  fir_taps: [1.0]
  fir_n_pre: 0
  swing: 1.0
  rj_ui: 0.01
rx:
  arch: mixed_signal
  ctle:
    enable: true
    peak_db: 7.0
  dfe:
    n_taps: 4
    adapt: sign_sign
    mu: 5.0e-4
    tap1_mode: unrolled     # speculative first tap (product practice at >=16G)
  cdr:
    kind: bang_bang
    kp_shift: 5
    ki_shift: 12
  noise_rms: 0.003
sim:
  n_symbols: 120000
  pattern: prbs31
  engine: time
