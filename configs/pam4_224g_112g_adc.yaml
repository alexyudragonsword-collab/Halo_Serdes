# 224 Gb/s PAM4 STRESS config — 112 GBd (the upper-bound rate, UI ~8.93 ps),
# ADC-based RX. Beyond the 106.25 GBd 802.3dj anchor; use to probe the rate
# ceiling (examples/15). osr=16 keeps the run responsive at this rate.
modulation: pam4
symbol_rate: 112.0e9
osr: 16
channel:
  kind: analytic
  length_m: 0.13
  rdc: 5.0
  r_skin: 2.5e-3
  l_per_m: 3.0e-7
  c_per_m: 1.2e-10
  loss_tangent: 0.015
  n_freq: 8192
tx:
  fir_taps: [-0.05, 1.0, -0.1]
  fir_n_pre: 1
  swing: 1.0
rx:
  arch: adc_dsp
  ctle:
    peak_db: 5.0
  adc:
    n_bits: 8
    n_lanes: 16
    enob: 6.5
  ffe:
    n_pre: 4
    n_post: 10
    adapt: lms
  dfe:
    n_taps: 1
    adapt: lms
  cdr:
    kind: mueller_muller
    kp_shift: 7
    ki_shift: 15
    pd_input: adc
  noise_rms: 0.0015
sim:
  n_symbols: 200000
  seed: 3
  pattern: prbs13q
  engine: time
