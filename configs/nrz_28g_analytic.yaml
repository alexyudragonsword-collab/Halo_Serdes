# 28 GBd NRZ mixed-signal on an analytic channel — the config behind the
# COM / crosstalk / AMI examples (23/24). Analytic channel means the
# Sweeps-Reach, Channel-COM, Crosstalk and AMI/COM tabs all work (they sweep
# channel length). A good general-purpose mixed-signal starting point.
modulation: nrz
symbol_rate: 28.0e9
osr: 16
channel:
  kind: analytic
  length_m: 0.28
  rdc: 5.0
  r_skin: 2.0e-3
  l_per_m: 3.0e-7
  c_per_m: 1.2e-10
  loss_tangent: 0.012
  n_freq: 8192
tx:
  fir_taps: [-0.08, 0.85, -0.05]
  fir_n_pre: 1
  swing: 1.0
  rj_ui: 0.005
rx:
  arch: mixed_signal
  ctle:
    enable: true
    peak_db: 7.0
  ffe:
    n_pre: 4
    n_post: 12
  dfe:
    n_taps: 2
    adapt: sign_sign
    mu: 5.0e-4
  cdr:
    kind: bang_bang
    kp_shift: 5
    ki_shift: 12
  noise_rms: 0.004
sim:
  n_symbols: 100000
  seed: 4
  pattern: prbs13
  engine: time
