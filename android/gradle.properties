org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- the versions M0 exists to validate -------------------------------------
# pythonVersion is pinned by SciPy wheel availability, NOT by preference:
# chaquo/chaquopy#1237 ("SciPy for Python 3.11 or later") was still open as of
# 2024-08, with wheels for 3.8/3.9/3.10 only. The project declares
# requires-python = ">=3.10", so 3.10 is the single version that satisfies both.
# If a newer Chaquopy has since gained SciPy, raise this — CI will say so.
chaquopyVersion=16.1.0
pythonVersion=3.10

agpVersion=8.7.3
kotlinVersion=2.0.21

# The Chaquopy CPython *build* the Cython-compiled variant compiles against.
# Distinct from pythonVersion above: that selects a series, this names the
# exact target archive on Maven Central (com.chaquo.python:target). It has to
# be the build Chaquopy itself downloads, because Cython's generated C reaches
# into CPython's internal headers -- so the compiled-apk CI job asserts this
# value against ~/.gradle/caches/.../com.chaquo.python/target/ after Gradle has
# run, and goes red naming both versions if they drift apart.
chaquopyTarget=3.10.19-0
