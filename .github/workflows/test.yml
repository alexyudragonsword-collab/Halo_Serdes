name: test

# Runs the test suite on both kernel paths (numba JIT and the HALO_NO_JIT
# pure-Python fallback) plus a ruff lint gate. Triggered on push/PR.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ examples/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jit: ["jit", "nojit"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,fec,jit,test]"
      - name: Run tests (${{ matrix.jit }})
        env:
          # nojit exercises the pure-Python fallback kernels
          HALO_NO_JIT: ${{ matrix.jit == 'nojit' && '1' || '' }}
        run: pytest -q
