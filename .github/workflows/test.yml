name: test

# Runs the test suite on both kernel paths (numba JIT and the HALO_NO_JIT
# pure-Python fallback) plus a ruff lint gate. Triggered on push/PR.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ examples/ android/tools/ android/app/src/main/python/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared by requires-python, and the version the
        # Android/Chaquopy build targets (its SciPy wheels stop at 3.10), so it
        # has to stay green — nothing else here would catch a 3.11-only feature.
        python: ["3.10", "3.11"]
        jit: ["jit", "nojit"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,fec,jit,test]"
      - name: Run tests (py${{ matrix.python }} ${{ matrix.jit }})
        env:
          # nojit exercises the pure-Python fallback kernels
          HALO_NO_JIT: ${{ matrix.jit == 'nojit' && '1' || '' }}
        run: pytest -q

  import-clean:
    # The Android build ships only numpy + scipy. This job installs *without*
    # the [gui] extra so Dash genuinely is absent, proving the app layer and the
    # phone compute path do not depend on it (or on skrf/PyYAML/matplotlib).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install without the GUI extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Import hygiene + facade contract
        run: pytest -q tests/test_import_hygiene.py tests/test_api_json.py

  rtl-lockstep:
    # Bit-exact check: the SystemVerilog fixed-point datapath vs the Python
    # golden model (closes the golden-model -> RTL loop).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install iverilog + package
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python -m pip install --upgrade pip
          pip install -e ".[jit]"
      - name: Lockstep
        run: bash rtl/run_lockstep.sh
