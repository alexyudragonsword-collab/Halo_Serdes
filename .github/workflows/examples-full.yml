name: examples-full

# Every example at its own size, compared line by line with
# examples/expected/ (tools/example_drift.py). The docs quote these numbers;
# a change that moves one fails here, with the doc lines that still quote the
# old value listed in the log -- including the numbers the docs derive from
# the outputs (examples/derived.yaml), re-derived from this run. The test
# workflow's `examples` job runs the same scripts at smoke size, which checks
# the code paths, not the numbers.
#
# When the change is meant to move numbers: fix the listed doc lines, then
# refresh the expected files -- `python tools/example_drift.py accept <dir>`
# on a local full-size run, or on this job's `example-outputs` artifact.
on:
  pull_request:
    paths:
      - "src/halo_serdes/**"
      - "src/halo_serdes_app/**"
      - "examples/**"
      - "configs/**"
      - "data/**"
      - "pyproject.toml"
      - "tools/run_examples.py"
      - "tools/example_drift.py"
      - ".github/workflows/examples-full.yml"
  push:
    branches: [main]
    paths:
      - "src/halo_serdes/**"
      - "src/halo_serdes_app/**"
      - "examples/**"
      - "configs/**"
      - "data/**"
      - "pyproject.toml"
      - "tools/run_examples.py"
      - "tools/example_drift.py"
      - ".github/workflows/examples-full.yml"
  schedule:
    # weekly: nothing pins numpy / scipy / numba, and their updates move
    # numbers too
    - cron: "37 3 * * 1"
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,fec,jit,test]"
          pip list | grep -i -E "^(numpy|scipy|numba) "
      - name: Run every example (full size)
        # the slowest (32, the optical ladders) is several minutes alone
        run: python tools/run_examples.py --jobs 4 --timeout 1800 --save new
      - name: Compare with examples/expected
        if: always()
        run: python tools/example_drift.py compare new
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs
          path: new/
          retention-days: 14
