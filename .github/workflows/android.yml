name: android

# Builds the M0 feasibility spike (android/) and runs it on an emulator.
#
# The build itself is the experiment: Chaquopy resolves and downloads the
# numpy/scipy/scikit-rf wheels at *build* time, so "does a SciPy wheel exist
# for the pinned Python?" — the single risk that decides whether the Android
# route is viable at all (chaquo/chaquopy#1237) — is answered by whether the
# assemble job goes green, with no device needed.
#
# What this can NOT answer, and still needs real hardware: 16 KB-page loading
# on Android 15+ devices, ARM float behaviour (the emulator is x86_64), and
# real-world performance.

on:
  push:
    paths:
      - "android/**"
      - "src/halo_serdes/**"
      - "src/halo_serdes_app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  assemble:
    name: build APK (answers the SciPy-wheel question)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a host CPython matching the target version to resolve
      # and stage pure-Python requirements.
      - name: Read the pinned Python version
        id: py
        run: |
          v=$(grep -E '^pythonVersion=' android/gradle.properties | cut -d= -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Chaquopy target Python: $v"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}

      - name: Golden values from this same commit
        # Generated on the host, bundled into the APK, and re-computed on the
        # device. A committed constant would rot; this cannot.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python android/tools/gen_probe_golden.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + androidTest APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Report APK size
        working-directory: android
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          find . -name "*.apk" -printf "%f\t%s bytes\n" | \
            awk -F'\t' '{printf "- `%s` — %.1f MB\n", $1, $2/1048576}' \
            >> "$GITHUB_STEP_SUMMARY"
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Record which wheels Chaquopy actually resolved
        if: always()
        working-directory: android
        run: |
          echo "### Resolved Python requirements" >> "$GITHUB_STEP_SUMMARY"
          find . -path "*chaquopy*" -name "*.dist-info" -maxdepth 12 -type d \
            -printf "- %f\n" | sort >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: halo-probe-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  emulator:
    name: run on emulator (proves the stack computes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned Python version
        id: py
        run: echo "version=$(grep -E '^pythonVersion=' android/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Golden values from this same commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python android/tools/gen_probe_golden.py
      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the emulator usable on a GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/**
          retention-days: 14
