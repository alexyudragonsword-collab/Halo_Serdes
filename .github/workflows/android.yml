name: android

# Builds the M0 feasibility spike (android/) and runs it on an emulator.
#
# The build itself is the experiment: Chaquopy resolves and downloads the
# numpy/scipy/scikit-rf wheels at *build* time, so "does a SciPy wheel exist
# for the pinned Python?" — the single risk that decides whether the Android
# route is viable at all (chaquo/chaquopy#1237) — is answered by whether the
# assemble job goes green, with no device needed.
#
# What this can NOT answer, and still needs real hardware: 16 KB-page loading
# on Android 15+ devices, ARM float behaviour (the emulator is x86_64), and
# real-world performance.

on:
  push:
    paths:
      - "android/**"
      - "src/halo_serdes/**"
      - "src/halo_serdes_app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  assemble:
    name: build APK (answers the SciPy-wheel question)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a host CPython matching the target version to resolve
      # and stage pure-Python requirements.
      - name: Read the pinned Python version
        id: py
        run: |
          v=$(grep -E '^pythonVersion=' android/gradle.properties | cut -d= -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Chaquopy target Python: $v"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}

      - name: Golden values from this same commit
        # Generated on the host, bundled into the APK, and re-computed on the
        # device. A committed constant would rot; this cannot.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python android/tools/gen_probe_golden.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + androidTest APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Report APK size
        working-directory: android
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          find . -name "*.apk" -printf "%f\t%s bytes\n" | \
            awk -F'\t' '{printf "- `%s` — %.1f MB\n", $1, $2/1048576}' \
            >> "$GITHUB_STEP_SUMMARY"
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Record which wheels Chaquopy actually resolved
        if: always()
        working-directory: android
        run: |
          echo "### Resolved Python requirements" >> "$GITHUB_STEP_SUMMARY"
          find . -path "*chaquopy*" -name "*.dist-info" -maxdepth 12 -type d \
            -printf "- %f\n" | sort >> "$GITHUB_STEP_SUMMARY" || true

      # Half of the gate. The other half runs in compiled-apk, and the pair
      # is what makes "these are two different builds" an assertion rather
      # than an assumption -- the realistic failure is two artifacts that
      # differ in filename only, and no line of either build log says so.
      - name: Assert this APK ships interpreted Python
        run: |
          python android/tools/inspect_apk.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --package halo_serdes --pure engine,analysis,channel

      - uses: actions/upload-artifact@v4
        with:
          name: halo-probe-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  wheel-versions:
    # Chaquopy does not ship what pyproject asks for. Its index resolves
    # numpy 1.26.2 and **scipy 1.8.1** (2022) against a declared floor of
    # scipy>=1.11 — and pip itself flags the pair as incompatible
    # ("scipy 1.8.1 has requirement numpy<1.25.0"). It evidently loads, but
    # "loads" is not "computes the same thing".
    #
    # So run the phone's compute path on the phone's exact versions, on a
    # host. This is far cheaper than an emulator and fails in a way that names
    # the cause, instead of arriving as a numerical mismatch later.
    name: library on Chaquopy's actual wheel versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install, then pin to what Chaquopy resolves
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # --no-deps: pyproject's floors would otherwise refuse these, which
          # is precisely the situation under test.
          pip install --no-deps --force-reinstall "numpy==1.26.2" "scipy==1.8.1"
          python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"
      - name: The compute path the phone actually runs
        run: pytest -q tests/test_import_hygiene.py tests/test_api_json.py
      - name: Probe end to end
        run: |
          python android/tools/gen_probe_golden.py
          python android/app/src/main/python/halo_probe.py

  compiled-apk:
    # The Cython-compiled variant. Everything about the app is identical --
    # same manifest, same Kotlin, same Compose, same Gradle task; the only
    # difference is that halo_serdes and halo_serdes_app arrive as .so inside
    # a wheel instead of as .py through Chaquopy's srcDirs.
    #
    # Be precise about what compiling buys, because the variant invites a
    # bigger claim than it earns: uncompiled modules still ship as bytecode,
    # literal constants survive in the constant pool where a short script finds
    # them exactly, and anything the UI displays is readable by anyone who can
    # run the app. It raises the cost of reading the *algorithms* from "unzip
    # and read" to "disassemble". See cairn/android-compiled-variant.md.
    name: build compiled APK (Cython -> .so)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned versions
        id: pin
        run: |
          cd android
          echo "python=$(grep -E '^pythonVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "target=$(grep -E '^chaquopyTarget=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pin.outputs.python }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Golden values from this same commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python android/tools/gen_probe_golden.py

      - name: Cross-compile the wheels
        run: |
          python -m pip install cython build
          # The runner image ships several NDKs and exports both
          # ANDROID_NDK_HOME and ANDROID_NDK_LATEST_HOME. Read them here in
          # the shell, not through ${{ env.X }}: the `env` context holds only
          # what the workflow itself declares, so that expression would expand
          # to the empty string and the build would fail claiming no NDK.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "::error::no NDK on this runner"; exit 1; }
          android/tools/build_compiled_wheels.sh arm64-v8a x86_64

      - name: Assemble the compiled APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      # Only on failure, and only a few lines: if the assemble above died on
      # "No matching distribution found for halo-serdes", the cause is almost
      # certainly a wheel tag Chaquopy's pip does not accept, and the answer is
      # whatever tags its *own* wheels carry. Android platform tags nest the
      # way manylinux does -- a build targeting a higher API accepts a lower
      # android_NN wheel -- so android_21 should be fine; this exists so that
      # if it is not, the fix (--api-level in build_compiled_wheels.sh) is
      # already on screen instead of one CI round trip away.
      - name: What tags does Chaquopy's own pip accept?
        if: failure()
        run: |
          echo "our wheels:"; ls android/app/pysrc || true
          echo "chaquopy's:"
          find ~/.gradle/caches android -name "*.whl" 2>/dev/null | grep -v pysrc | head -20
          find android -path "*chaquopy*" -name "*.dist-info" -type d 2>/dev/null | head -20

      - name: Assert the pinned CPython target is the one Chaquopy uses
        # Cython's generated C reaches into CPython's internal headers, so
        # compiling against a different build than the one the APK actually
        # runs is not a clean-compile-then-works situation -- it is a crash on
        # a device, or worse, silence. Gradle has now downloaded the real one;
        # compare and fail naming both.
        run: |
          cache=~/.gradle/caches/modules-2/files-2.1/com.chaquo.python/target
          actual=$(ls "$cache" 2>/dev/null | sort -V | tail -1)
          pinned=${{ steps.pin.outputs.target }}
          echo "pinned=$pinned  chaquopy downloaded=$actual"
          if [ -z "$actual" ]; then
            echo "::error::could not read $cache -- the assertion that the "\
                 "compile target matches Chaquopy's did not actually run"
            exit 1
          fi
          if [ "$actual" != "$pinned" ]; then
            echo "::error title=CPython target drift::chaquopyTarget=$pinned "\
                 "but Chaquopy downloaded $actual. Update chaquopyTarget in "\
                 "android/gradle.properties."
            exit 1
          fi

      - name: Assert this APK ships compiled Python
        # The failure this exists for: ../../src left in srcDirs, or a stale
        # pip output, so the "compiled" APK is the interpreted one under a
        # different name. Nothing in the build log distinguishes them.
        run: |
          python android/tools/inspect_apk.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --package halo_serdes --native engine,analysis,channel \
            --pure dsp/mlsd,cdr/kernels

      - name: Report size against the interpreted build
        run: |
          echo "### Compiled APK" >> "$GITHUB_STEP_SUMMARY"
          find android -name "*.apk" -printf "%f\t%s bytes\n" | \
            awk -F'\t' '{printf "- `%s` — %.1f MB\n", $1, $2/1048576}' \
            >> "$GITHUB_STEP_SUMMARY"
          echo "### Wheels" >> "$GITHUB_STEP_SUMMARY"
          ls -la android/app/pysrc >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: halo-compiled-wheels
          path: android/app/pysrc/*.whl
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: halo-compiled-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  compiled-emulator:
    # The one thing a clean cross-compile does not prove: that the .so loads.
    # A correct-looking wheel and a green build say nothing about `import` on
    # a real Android CPython, so run the whole instrumented suite -- the same
    # 32 tests, launching the real Activity and driving the real engine --
    # against the compiled build.
    name: compiled APK on emulator (proves the .so imports)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: compiled-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned Python version
        id: py
        run: echo "version=$(grep -E '^pythonVersion=' android/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Golden values from this same commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python android/tools/gen_probe_golden.py
      - uses: gradle/actions/setup-gradle@v4

      # Reuse the wheels compiled-apk built rather than cross-compiling twice.
      # Their presence in pysrc/ is what switches the Gradle build to the
      # compiled variant, so this download is not an optimisation -- it is how
      # this job becomes the compiled one.
      - uses: actions/download-artifact@v4
        with:
          name: halo-compiled-wheels
          path: android/app/pysrc
      - name: Confirm the wheels arrived
        run: |
          ls -la android/app/pysrc
          n=$(ls android/app/pysrc/*.whl 2>/dev/null | wc -l)
          [ "$n" -ge 2 ] || { echo "::error::expected 2 wheels, found $n -- "\
            "without them this job would silently test the interpreted build"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented test against the compiled build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/tools/run_instrumented.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-instrumented-test-report
          path: android/app/build/reports/androidTests/**
          retention-days: 14

      - name: Test summary, repeated where the log tail can reach it
        if: always()
        run: cat android/app/build/outputs/ci-summary.txt || echo "no summary written"

  emulator:
    name: run on emulator (proves the stack computes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the pinned Python version
        id: py
        run: echo "version=$(grep -E '^pythonVersion=' android/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Golden values from this same commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python android/tools/gen_probe_golden.py
      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the emulator usable on a GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # Must stay a single quote-free command: this action runs `script`
          # through `sh -c "<script>"`, so an embedded double quote truncates
          # it. The failure detail lives in the script file instead.
          script: bash android/tools/run_instrumented.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/**
          retention-days: 14

      # What the app actually looked like. CI can assert that a chart drew
      # *something*; whether it drew the right thing still needs eyes, and
      # this is what they look at instead of installing the APK.
      - uses: actions/upload-artifact@v4
        if: always()
        # Screenshots are evidence, not a gate. A run where all 32 tests passed
        # must not go red because the pictures could not be collected — which
        # is exactly what happened once, and inverts what this artifact is for.
        continue-on-error: true
        with:
          name: ui-screenshots
          path: android/app/build/outputs/screenshots/**
          if-no-files-found: ignore
          retention-days: 14

      # Last step on purpose. Reading a job log from outside GitHub means
      # reading its tail, and the test step's own output sits ahead of ~120
      # lines of emulator teardown and cache writes — four attempts to fetch a
      # window containing the counts landed beside them instead. Repeating
      # those few lines here puts them where they can always be read.
      - name: Test summary, repeated where the log tail can reach it
        if: always()
        run: cat android/app/build/outputs/ci-summary.txt || echo "no summary written"
