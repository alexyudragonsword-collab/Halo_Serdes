[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-serdes"
version = "0.0.1"
description = "System-level behavioral simulation framework for high-speed SerDes (NRZ to 32G, PAM4 to 224G) with mixed-signal and ADC-based receiver architectures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-rf>=0.29",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
jit = ["numba>=0.59"]
fec = ["galois>=0.3"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
