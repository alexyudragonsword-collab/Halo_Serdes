[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-serdes"
version = "0.0.1"
description = "System-level behavioral simulation framework for high-speed SerDes (NRZ to 32G, PAM4 to 224G) with mixed-signal and ADC-based receiver architectures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-rf>=0.29",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
jit = ["numba>=0.59"]
fec = ["galois>=0.3"]
test = ["pytest>=7.0"]
gui = [
    "dash>=2.16",
    "plotly>=5.20",
    "dash-bootstrap-components>=1.5",
    "diskcache>=5.6",
]

[project.scripts]
halo-serdes-gui = "halo_serdes_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
halo_serdes_gui = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
