# Numbers the docs derive from the examples' outputs -- a difference of two
# printed values, a sum of rounded rows, the range of a printed column -- that
# tools/example_drift.py cannot find from the outputs alone. Each entry says
# where its operands are printed and which doc text quotes the result;
# `python tools/example_drift.py derived` checks every quote against
# examples/expected/, and `compare` re-derives them from a new run. The format
# is described above `Derived` in tools/example_drift.py.
#
# Register a number here when a doc states one that no example prints. A
# number an example prints is found without this file (unless the doc quotes
# it at one or two digits outside a block that cites the example, as the
# "36 / 38 dB" milestones below do).

- name: ex12 mixed-signal limit, NRZ vs PAM4 (last open eye on the Whisper backplane)
  values:
    nrz: {example: "12", line: "NRZ @ Whisper backplane: {*} Gb/s ({*} GBd, {} dB@Nyq"}
    pam4: {example: "12", line: "PAM4 @ Whisper backplane: {*} Gb/s ({*} GBd, {} dB@Nyq"}
  quotes:
    - {doc: README.md, text: "最后一个开眼点 NRZ {nrz} dB、PAM4 {pam4} dB,相差 {nrz - pam4} dB"}
    - {doc: docs/SUMMARY.md, text: "最后一个开眼点 NRZ {nrz} dB、PAM4 {pam4} dB,相差 {nrz - pam4} dB"}
    - {doc: docs/SUMMARY.md, text: "NRZ at {nrz} dB and PAM4 at {pam4} dB: {nrz - pam4} dB apart"}
    - {doc: docs/summary.html, text: "最后一个开眼点 NRZ {nrz} dB、PAM4 {pam4} dB,相差 {nrz - pam4} dB"}
    - {doc: docs/summary.html, text: "NRZ at {nrz} dB and PAM4 at {pam4} dB, {nrz - pam4} dB apart"}

